[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Deploy.s.sol seeds the reserved tag list from this generated file.
fs_permissions = [{ access = "read", path = "./reserved-tags.json" }]

[rpc_endpoints]
robinhood = "${RHC_RPC_URL:-https://rpc.robinhood.com}"
robinhood_testnet = "${RHC_RPC_URL:-https://testnet-rpc.robinhood.com}"
