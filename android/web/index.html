<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Tera Wallet</title>
    <meta
      name="description"
      content="Tera Wallet on the web. Create or import a wallet, sign on this device, and install it like an app."
    />
    <meta name="theme-color" content="#171e19" />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="icon" href="/app/icon-192.png" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tera" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // An app script that fails to load means this page is older than the
      // files on the server. Reloading once fetches the current page; the flag
      // stops a real outage from reloading forever.
      addEventListener(
        "error",
        function (event) {
          var el = event.target;
          if (!el || el.tagName !== "SCRIPT" || String(el.src).indexOf("/app/_expo/") < 0) return;
          try {
            if (sessionStorage.getItem("tera-reloaded")) return;
            sessionStorage.setItem("tera-reloaded", "1");
          } catch (e) {
            return;
          }
          location.reload();
        },
        true,
      );
      addEventListener("load", function () {
        setTimeout(function () {
          try {
            sessionStorage.removeItem("tera-reloaded");
          } catch (e) {}
        }, 15000);
      });
    </script>
    <style>
      /* Tokens from android/src/ui.tsx, so the page around the app is the app's own. */
      :root {
        --bg: #171e19;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        overscroll-behavior: none;
      }
      body {
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      /* The app owns the whole window, on a phone and on a desktop alike. */
      #frame {
        position: fixed;
        inset: 0;
        display: flex;
        background: var(--bg);
      }
      #root {
        display: flex;
        flex: 1;
        min-width: 0;
      }

      /*
        react-native-web focuses the first focusable thing in a modal when it
        opens, and in a sheet that is the full-window backdrop: the browser then
        ringed the whole window. Backdrops and sheet bodies are role-less
        touch targets, not controls, so only they lose the ring; buttons keep it.
      */
      [aria-modal="true"] [tabindex="0"]:not([role]):focus {
        outline: none;
      }
      /*
        Shown until the app's script has downloaded and React replaces it. The
        script is ~650 KB compressed, so on a slow connection this is what the
        page shows for a while, rather than an empty screen that reads as broken.
      */
      #boot {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #a9a28f;
        font: 15px/1.5 system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      #boot img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #boot .slow {
        display: none;
        font-size: 13px;
        max-width: 280px;
      }
      #boot.slow .slow {
        display: block;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.45;
        }
      }
      noscript {
        color: #f5ecd7;
        font: 15px/1.5 system-ui, sans-serif;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <noscript>Tera Wallet needs JavaScript to run.</noscript>
    <div id="frame">
      <div id="root">
        <div id="boot">
          <img src="/app/icon-192.png" alt="" />
          <div>Opening Tera…</div>
          <div class="slow">Still loading. Your connection looks slow; Tera will open as soon as it has downloaded.</div>
        </div>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var boot = document.getElementById("boot");
        if (boot) boot.className = "slow";
      }, 8000);
    </script>
    <script>
      if ("serviceWorker" in navigator)
        addEventListener("load", function () {
          navigator.serviceWorker.register("/app/sw.js", { scope: "/app/" }).catch(function () {});
        });
    </script>
    <!-- tera:scripts -->
  </body>
</html>
