name: Android wallet
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build a production-signed APK and AAB (requires signing secrets)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'TeraWalletRH/TeraWallet'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      TERA_SIGNED_RELEASE: ${{ inputs.signed_release && 'true' || 'false' }}
      EXPO_PUBLIC_API_URL: https://api.terawallet.app
      EXPO_PUBLIC_RPC_URL: https://rpc.mainnet.chain.robinhood.com
      EXPO_PUBLIC_POLICY_SIGNER_PUBLIC_KEY: ${{ vars.EXPO_PUBLIC_POLICY_SIGNER_PUBLIC_KEY || '0x5b2759f9620f54a5E1651A567Ebd8381F07f9f05' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run check && bun test tests
      - run: bunx expo install --check
      - run: bun run export
      - run: bun run prebuild
      - name: Build preview APK
        if: ${{ !inputs.signed_release }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../../artifacts
          cp app/build/outputs/apk/release/app-release.apk ../../artifacts/tera-android-preview.apk
      - name: Build signed release
        if: ${{ inputs.signed_release && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$EXPO_PUBLIC_POLICY_SIGNER_PUBLIC_KEY"
          export TERA_KEYSTORE_PATH="$RUNNER_TEMP/tera-release.jks"
          trap 'rm -f "$TERA_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$TERA_KEYSTORE_PATH"
          printf '\napply from: "../../scripts/signing.gradle"\n' >> android/app/build.gradle
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon
          mkdir -p ../../artifacts
          cp app/build/outputs/apk/release/app-release.apk ../../artifacts/tera-android.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../artifacts/tera-android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: tera-android-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
