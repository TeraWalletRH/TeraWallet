name: Android wallet
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build a production-signed APK and AAB (requires signing secrets)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'TeraWalletRH/TeraWallet'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      TERA_SIGNED_RELEASE: ${{ inputs.signed_release && 'true' || 'false' }}
      EXPO_PUBLIC_API_URL: https://api.terawallet.app
      EXPO_PUBLIC_RPC_URL: https://rpc.mainnet.chain.robinhood.com
      EXPO_PUBLIC_POLICY_SIGNER_PUBLIC_KEY: ${{ vars.EXPO_PUBLIC_POLICY_SIGNER_PUBLIC_KEY || '0x5b2759f9620f54a5E1651A567Ebd8381F07f9f05' }}
      # Unset means no JavaScript update channel, and the Update button falls
      # back to downloading a new APK.
      EXPO_PUBLIC_UPDATES_URL: ${{ vars.EXPO_PUBLIC_UPDATES_URL || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Ubuntu runners already provide an Android SDK. Avoid the setup action:
      # it has intermittently failed before the app build begins.
      - name: Use runner Android SDK
        run: |
          test -n "$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run check && bun test tests
      - run: bunx expo install --check
      - run: bun run export
      - run: bun run prebuild
      - name: Build Android App Bundle (.aab) and APK (.apk)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Applying release signing configuration..."
          export TERA_KEYSTORE_PATH="$RUNNER_TEMP/tera-release.jks"
          trap 'rm -f "$TERA_KEYSTORE_PATH"' EXIT
          node -e '
            const fs = require("fs");
            let b64 = (process.env.ANDROID_KEYSTORE_BASE64 || "").replace(/[^A-Za-z0-9+/=]/g, "");
            if (b64.length !== 3704 && fs.existsSync("scripts/release-keystore.b64")) {
              console.log("Using committed release-keystore.b64 fallback...");
              b64 = fs.readFileSync("scripts/release-keystore.b64", "utf8").trim();
            }
            const buf = Buffer.from(b64, "base64");
            fs.writeFileSync(process.env.TERA_KEYSTORE_PATH, buf);
            console.log("Restored keystore size:", buf.length);
          '
          test -s "$TERA_KEYSTORE_PATH"
          keytool -list -keystore "$TERA_KEYSTORE_PATH" -storepass "${ANDROID_KEYSTORE_PASSWORD:-TeraWallet2026Secure}" -storetype PKCS12
          printf '\napply from: "../../scripts/signing.gradle"\n' >> android/app/build.gradle
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/artifacts/tera-android.aab"
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/artifacts/tera-android.apk"
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/artifacts/tera-android-preview.apk"
          fi
          ls -la "$GITHUB_WORKSPACE/artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: tera-android-${{ github.run_number }}
          path: ${{ github.workspace }}/artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Write the version manifest
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          # The floor below which a build stops being offered as optional and
          # starts being told it is unsupported. Set it as a repository
          # variable when a release must not be kept running; leaving it at 1
          # means every published build is a suggestion, never a demand.
          MIN_SUPPORTED: ${{ vars.ANDROID_MIN_SUPPORTED_VERSION_CODE || '1' }}
        working-directory: .
        run: |
          apk="$GITHUB_WORKSPACE/artifacts/tera-android-preview.apk"
          # Computed in the run that produced the binary. A digest taken later,
          # from whatever a server downloaded, would establish nothing.
          digest="$(sha256sum "$apk" | cut -d" " -f1)"
          version_name="$(node -p "require('./android/app.json').expo.version")"
          cat > "$GITHUB_WORKSPACE/artifacts/tera-android-preview.json" <<JSON
          {
            "platform": "android",
            "versionCode": ${GITHUB_RUN_NUMBER},
            "versionName": "${version_name}",
            "minSupportedVersionCode": ${MIN_SUPPORTED},
            "sha256": "${digest}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": "Automated Android preview build."
          }
          JSON
          node -e "JSON.parse(require('fs').readFileSync('$GITHUB_WORKSPACE/artifacts/tera-android-preview.json','utf8'))"
          cat "$GITHUB_WORKSPACE/artifacts/tera-android-preview.json"
      - name: Publish latest preview APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release view android-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create android-preview --repo "$GITHUB_REPOSITORY" --title "Tera Android Preview" --notes "Latest automated Android preview build." --prerelease --latest=false
          gh release upload android-preview "$GITHUB_WORKSPACE/artifacts/tera-android-preview.apk" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload android-preview "$GITHUB_WORKSPACE/artifacts/tera-android-preview.json" --repo "$GITHUB_REPOSITORY" --clobber
