<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private send — Tera</title><style>body{margin:0;background:#f6f5f2;color:#18251e;font-family:Arial}.w{max-width:720px;margin:auto;padding:28px}.nav{font:14px monospace;border-bottom:1px solid #c9d0bf;padding-bottom:20px}.nav a{color:inherit;text-decoration:none}.hero{padding:50px 0 25px}h1{font-size:clamp(48px,10vw,86px);letter-spacing:-.08em;font-weight:400;line-height:.88;margin:10px 0}.ey{font:11px monospace;color:#74803c;text-transform:uppercase}.p{border:1px solid #c9d0bf;background:#fff;padding:22px;margin-top:18px}.row{display:flex;gap:10px;flex-wrap:wrap}.i{padding:14px;border:1px solid #aeb9a1;flex:1;font:16px Arial}.b{padding:14px 17px;border:0;background:#1d4330;color:#fff;font:13px monospace;cursor:pointer}.note,#status{color:#697461;line-height:1.5}.step{font:12px monospace;border-top:1px solid #d6ddce;padding:12px 0}.ok{color:#356e45}</style></head><body><main class="w"><nav class="nav"><a href="/">TERA WALLET</a> / <a href="/dashboard/">WALLET</a></nav><section class="hero"><div class="ey">Private routing / ETH + TERA</div><h1>Route privately.<br>Send deliberately.</h1><p class="note">Tera routes a confirmed deposit through separate intake and payout wallets. This reduces the direct sender-recipient link; it is not anonymous or untraceable.</p><div class="row"><button class="b" id="connect">Connect wallet</button><span id="status">Connect to begin.</span></div></section><section class="p"><div class="row"><select class="i" id="asset"><option>ETH</option><option>TERA</option></select><input class="i" id="amount" inputmode="decimal" placeholder="Amount"><input class="i" id="recipient" placeholder="Recipient 0x address"></div><div class="row" style="margin-top:10px"><button class="b" id="route">Review private route</button></div></section><section class="p"><div class="ey">Route status</div><div id="job" class="note">No route started.</div></section></main><script>const api='https://api.terawallet.app',q=s=>document.querySelector(s);let owner='',job=(()=>{try{return JSON.parse(localStorage.getItem('tera.privateSendJob')||'null')}catch{return null}})(),timer=null;const u=v=>{if(!/^\d*(\.\d*)?$/.test(v)||!/[0-9]/.test(v))throw Error('Enter a valid amount.');let[a,b='']=v.split('.');if(b.length>18)throw Error('Maximum 18 decimals.');return(BigInt(a||0)*10n**18n+BigInt((b+'0'.repeat(18)).slice(0,18))).toString()};const f=async(p,o={})=>{let r=await fetch(api+p,{headers:{'content-type':'application/json'},...o}),j=await r.json();if(!r.ok||j.success===false)throw Error(j.error||'Request failed');return j};const say=x=>q('#status').textContent=x;async function refresh(){if(!job)return;let r=await f('/api/private-send/jobs/'+job.id);job=r.job;localStorage.setItem('tera.privateSendJob',JSON.stringify(job));q('#job').innerHTML=`<div class="step">DEPOSIT · ${job.deposit_tx_hash||'awaiting'}</div><div class="step">INTAKE SWEEP · ${job.sweep_tx_hash||'awaiting'}</div><div class="step">RECIPIENT PAYOUT · ${job.payout_tx_hash||'awaiting'}</div><div class="step ok">${job.status.toUpperCase()}</div>`;if(job.status==='confirmed'||job.status==='failed'||job.status==='expired')localStorage.removeItem('tera.privateSendJob');else{clearTimeout(timer);timer=setTimeout(refresh,12000)}}q('#connect').onclick=async()=>{try{owner=(await ethereum.request({method:'eth_requestAccounts'}))[0];q('#connect').textContent=owner.slice(0,6)+'…'+owner.slice(-4);say('Wallet connected.')}catch(e){say(e.message)}};q('#route').onclick=async()=>{try{if(!owner)throw Error('Connect your wallet first.');let asset=q('#asset').value,amount=u(q('#amount').value),recipient=q('#recipient').value.trim();let r=await f('/api/private-send/jobs',{method:'POST',body:JSON.stringify({asset,amount,senderAddress:owner,recipientAddress:recipient})});job=r.job;localStorage.setItem('tera.privateSendJob',JSON.stringify(job));say('Review the exact deposit in your wallet.');let tx=await ethereum.request({method:'eth_sendTransaction',params:[{from:owner,to:r.preparedDeposit.to,data:r.preparedDeposit.data,value:r.preparedDeposit.value}]});await f('/api/private-send/jobs/'+job.id+'/deposit',{method:'POST',body:JSON.stringify({txHash:tx})});say('Deposit submitted. Routing begins after confirmations.');refresh()}catch(e){say(e.message)}};if(job)refresh().catch(e=>say(e.message));</script></body></html>
