<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TERA Admin Console</title>
    <link rel="icon" href="/logo.png" />
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: #0d1712;
        color: #f2f0ee;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #0d1712; }
      .nav { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #243b2c; padding-bottom: 16px; margin-bottom: 24px; }
      .brand { font-size: 16px; font-weight: 700; color: #f7f4de; text-decoration: none; display: flex; align-items: center; gap: 10px; font-family: 'IBM Plex Mono', monospace; }
      .brand img { height: 32px; width: auto; }
      .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
      .nav-links a { color: #9da998; text-decoration: none; font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 8px; transition: all 0.2s; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; }
      .nav-links a:hover, .nav-links a.active { background: #243b2c; color: #f7f4de; border: 1px solid #768143; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 32px; }
      .card { background: #16251c; border: 1px solid #243b2c; border-radius: 14px; padding: 20px; }
      .card-title { font-size: 11px; font-weight: 600; color: #8a9765; margin-bottom: 8px; text-transform: uppercase; font-family: 'IBM Plex Mono', monospace; }
      .card-val { font-size: 28px; font-weight: 700; color: #f7f4de; font-family: monospace; }
      .section { background: #16251c; border: 1px solid #243b2c; border-radius: 14px; padding: 24px; margin-bottom: 24px; }
      h2 { font-size: 16px; font-weight: 700; margin-top: 0; color: #f7f4de; }
      table { width: 100%; text-align: left; border-collapse: collapse; font-size: 12px; }
      th { padding: 12px; background: #0b130e; border-bottom: 1px solid #243b2c; color: #8a9765; text-transform: uppercase; font-family: 'IBM Plex Mono', monospace; }
      td { padding: 12px; border-bottom: 1px solid #243b2c; font-family: monospace; color: #c4cebf; }
      .btn { padding: 8px 12px; background: #243b2c; border: 1px solid #768143; border-radius: 8px; color: #f7f4de; font-weight: 700; font-size: 12px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; }
      .btn:hover { background: #52643e; color: #ffffff; }
      .btn-danger { background: rgba(244, 63, 94, 0.15); color: #f87171; border: 1px solid rgba(244, 63, 94, 0.3); }
      .btn-danger:hover { background: rgba(244, 63, 94, 0.3); }
      .badge { padding: 4px 8px; border-radius: 9999px; font-size: 10px; font-weight: 700; text-transform: uppercase; background: rgba(138, 151, 101, 0.15); color: #8a9765; border: 1px solid rgba(138, 151, 101, 0.3); font-family: 'IBM Plex Mono', monospace; }
    </style>
  </head>
  <body>
    <header class="nav">
      <a href="/admin/dashboard" class="brand">
        <img src="/logo.png" alt="Tera Logo" onerror="this.onerror=null; this.src='/tera/logo.png';" />
        <span>TERA ADMIN</span>
      </a>
      <div class="nav-links">
        <a href="/admin/dashboard" class="active">Overview</a>
        <a href="/admin/accounts">Accounts</a>
        <a href="/admin/tags">Tags (@tags)</a>
        <a href="/admin/business-emails">Emails</a>
        <a href="/admin/teams">Teams</a>
        <a href="/admin/payment-links">Payment Links</a>
        <a href="/admin/private-jobs">Private Jobs</a>
        <a href="/admin/staking">Staking</a>
        <a href="/admin/audit-logs">Audit Logs</a>
        <a href="#" id="signOutBtn" style="color: #f87171;">Sign Out</a>
      </div>
    </header>
    </header>

    <main id="app">
      <div class="grid" id="statsGrid">
        <div class="card"><div class="card-title">Total Accounts</div><div class="card-val" id="stAccounts">—</div></div>
        <div class="card"><div class="card-title">Active Sessions</div><div class="card-val" id="stSessions">—</div></div>
        <div class="card"><div class="card-title">Registered Tags</div><div class="card-val" id="stTags">—</div></div>
        <div class="card"><div class="card-title">Business Emails</div><div class="card-val" id="stEmails">—</div></div>
      </div>

      <div class="section">
        <h2>Recent Admin Audit Activity</h2>
        <table>
          <thead>
            <tr><th>Action</th><th>Target Entity</th><th>Target ID</th><th>Timestamp</th></tr>
          </thead>
          <tbody id="activityBody">
            <tr><td colspan="4" style="color: #64748b; text-align: center;">Loading activity telemetry...</td></tr>
          </tbody>
        </table>
      </div>
    </main>

    <script>
      const token = localStorage.getItem('tera_admin_token');
      if (!token && !location.pathname.includes('/login')) {
        window.location.href = '/admin/login';
      }

      async function apiFetch(path) {
        const res = await fetch('/api/admin' + path, {
          headers: {
            'Authorization': 'Bearer ' + token,
            'x-admin-token': token || ''
          }
        });
        if (res.status === 401) {
          localStorage.removeItem('tera_admin_token');
          window.location.href = '/admin/login';
          throw Error('Unauthorized');
        }
        return res.json();
      }

      async function loadStats() {
        try {
          const data = await apiFetch('/stats');
          if (data.success && data.stats) {
            document.getElementById('stAccounts').textContent = data.stats.totalAccounts || 0;
            document.getElementById('stSessions').textContent = data.stats.totalActiveSessions || 0;
            document.getElementById('stTags').textContent = data.stats.totalTags || 0;
            document.getElementById('stEmails').textContent = data.stats.totalBusinessEmails || 0;

            const tbody = document.getElementById('activityBody');
            if (data.recentActivity && data.recentActivity.length > 0) {
              tbody.innerHTML = data.recentActivity.map(act => `
                <tr>
                  <td style="color: #34d399; font-weight: bold;">${act.action}</td>
                  <td>${act.target_entity}</td>
                  <td>${act.target_id}</td>
                  <td style="color: #64748b;">${new Date(act.created_at).toLocaleString()}</td>
                </tr>
              `).join('');
            } else {
              tbody.innerHTML = '<tr><td colspan="4" style="color: #64748b; text-align: center;">No audit logs yet.</td></tr>';
            }
          }
        } catch (e) { console.error(e); }
      }

      document.getElementById('signOutBtn').onclick = (e) => {
        e.preventDefault();
        localStorage.removeItem('tera_admin_token');
        window.location.href = '/admin/login';
      };

      loadStats();
    </script>
  </body>
</html>
