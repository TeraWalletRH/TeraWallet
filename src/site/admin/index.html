<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TERA Admin Console · Real-Time Management</title>
    <link rel="icon" href="/tera/logo.png" />
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: #0d1712;
        color: #f2f0ee;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: radial-gradient(circle at 50% 10%, #172a1e 0%, #0d1712 80%);
        min-height: 100vh;
      }
      
      /* Navigation Bar */
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #243b2c;
        padding-bottom: 18px;
        margin-bottom: 24px;
        gap: 16px;
        position: relative;
      }
      .brand {
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .logo-box {
        width: 42px;
        height: 42px;
        background: #16251c;
        border: 1px solid #768143;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 12px rgba(118, 129, 67, 0.25);
        padding: 4px;
      }
      .logo-box img {
        height: 32px;
        width: 32px;
        object-fit: contain;
      }
      .brand-text {
        display: flex;
        flex-direction: column;
      }
      .brand-text .title {
        font-size: 16px;
        font-weight: 800;
        color: #f7f4de;
        font-family: 'IBM Plex Mono', monospace;
        letter-spacing: 0.05em;
        line-height: 1.2;
      }
      .brand-text .subtitle {
        font-size: 10px;
        font-weight: 600;
        color: #8a9765;
        font-family: 'IBM Plex Mono', monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .nav-links {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .nav-links a {
        color: #9da998;
        text-decoration: none;
        font-size: 11px;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 8px;
        transition: all 0.2s ease;
        font-family: 'IBM Plex Mono', monospace;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .nav-links a:hover {
        color: #f7f4de;
        background: #1a2c20;
        border-color: rgba(118, 129, 67, 0.4);
      }
      .nav-links a.active {
        background: #243b2c;
        color: #f7f4de;
        border-color: #768143;
        box-shadow: 0 2px 10px rgba(118, 129, 67, 0.25);
      }
      .mobile-menu-btn {
        display: none;
        background: #16251c;
        border: 1px solid #768143;
        color: #f7f4de;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        font-family: 'IBM Plex Mono', monospace;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        transition: all 0.2s;
      }
      .mobile-menu-btn:hover {
        background: #243b2c;
        border-color: #8a9765;
      }

      /* Grid & Clickable Stat Card Elements */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }
      .card {
        background: #16251c;
        border: 1px solid #243b2c;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        cursor: pointer;
        user-select: none;
      }
      .card:hover {
        border-color: #768143;
        transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(118, 129, 67, 0.2);
      }
      .card-title {
        font-size: 11px;
        font-weight: 700;
        color: #8a9765;
        margin-bottom: 8px;
        text-transform: uppercase;
        font-family: 'IBM Plex Mono', monospace;
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .card-title .arrow {
        opacity: 0.5;
        transition: opacity 0.2s, transform 0.2s;
      }
      .card:hover .card-title .arrow {
        opacity: 1;
        transform: translateX(3px);
      }
      .card-val {
        font-size: 28px;
        font-weight: 800;
        color: #f7f4de;
        font-family: 'IBM Plex Mono', monospace;
      }

      /* Sections & Tables */
      .section {
        background: #16251c;
        border: 1px solid #243b2c;
        border-radius: 14px;
        padding: 24px;
        margin-bottom: 24px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      }
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 16px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .search-input {
        padding: 8px 14px;
        background: #0b130e;
        border: 1px solid #2e4736;
        border-radius: 8px;
        color: #f7f4de;
        font-size: 12px;
        font-family: 'IBM Plex Mono', monospace;
        outline: none;
        min-width: 220px;
        transition: all 0.2s;
      }
      .search-input:focus {
        border-color: #768143;
        box-shadow: 0 0 0 2px rgba(118, 129, 67, 0.2);
      }

      h2 {
        font-size: 16px;
        font-weight: 700;
        margin: 0;
        color: #f7f4de;
        font-family: 'IBM Plex Mono', monospace;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sub-title {
        font-size: 12px;
        color: #8a9765;
        margin-top: 4px;
        font-weight: 400;
        font-family: Inter, sans-serif;
      }

      .table-wrap {
        overflow-x: auto;
        border: 1px solid #243b2c;
        border-radius: 10px;
        -webkit-overflow-scrolling: touch;
      }
      table {
        width: 100%;
        text-align: left;
        border-collapse: collapse;
        font-size: 12px;
        min-width: 680px;
      }
      th {
        padding: 14px 16px;
        background: #0b130e;
        border-bottom: 1px solid #243b2c;
        color: #8a9765;
        text-transform: uppercase;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.05em;
      }
      td {
        padding: 14px 16px;
        border-bottom: 1px solid #243b2c;
        font-family: 'IBM Plex Mono', monospace;
        color: #c4cebf;
        white-space: nowrap;
      }
      tr:last-child td { border-bottom: 0; }
      tr:hover td { background: rgba(36, 59, 44, 0.45); }

      /* Buttons & Badges */
      .btn {
        padding: 7px 14px;
        background: #243b2c;
        border: 1px solid #768143;
        border-radius: 6px;
        color: #f7f4de;
        font-weight: 700;
        font-size: 11px;
        cursor: pointer;
        font-family: 'IBM Plex Mono', monospace;
        text-transform: uppercase;
        transition: all 0.15s;
        letter-spacing: 0.03em;
      }
      .btn:hover {
        background: #52643e;
        color: #ffffff;
        border-color: #8a9765;
        box-shadow: 0 2px 8px rgba(118, 129, 67, 0.3);
      }
      .btn-danger {
        background: rgba(239, 68, 68, 0.12);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }
      .btn-danger:hover {
        background: rgba(239, 68, 68, 0.25);
        color: #ffffff;
        border-color: #f87171;
      }

      .badge {
        padding: 4px 10px;
        border-radius: 9999px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        background: rgba(138, 151, 101, 0.15);
        color: #8a9765;
        border: 1px solid rgba(138, 151, 101, 0.3);
        font-family: 'IBM Plex Mono', monospace;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .badge-success { background: rgba(52, 211, 153, 0.15); color: #34d399; border-color: rgba(52, 211, 153, 0.3); }
      .badge-warning { background: rgba(251, 191, 36, 0.15); color: #fbbf24; border-color: rgba(251, 191, 36, 0.3); }

      .empty-state {
        text-align: center;
        padding: 44px 16px;
        color: #72806a;
        font-family: 'IBM Plex Mono', monospace;
      }

      .pagination {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid #243b2c;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12px;
        color: #8a9765;
      }
      .pagination-btns {
        display: flex;
        gap: 8px;
      }

      /* Custom High-End Modal UI */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(10, 18, 14, 0.82);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 16px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      .modal-overlay.is-visible {
        opacity: 1;
        pointer-events: auto;
      }
      .modal-card {
        background: #16251c;
        border: 1px solid #768143;
        border-radius: 16px;
        max-width: 520px;
        width: 100%;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
        overflow: hidden;
        transform: scale(0.95) translateY(10px);
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .modal-overlay.is-visible .modal-card {
        transform: scale(1) translateY(0);
      }
      .modal-header {
        background: #0b130e;
        padding: 18px 24px;
        border-bottom: 1px solid #243b2c;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .modal-title-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .modal-icon-badge {
        width: 32px;
        height: 32px;
        background: rgba(118, 129, 67, 0.2);
        border: 1px solid #768143;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f7f4de;
        font-weight: 700;
        font-size: 14px;
        font-family: 'IBM Plex Mono', monospace;
      }
      .modal-title {
        font-size: 15px;
        font-weight: 700;
        color: #f7f4de;
        font-family: 'IBM Plex Mono', monospace;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .modal-close-btn {
        background: transparent;
        border: 0;
        color: #8a9765;
        font-size: 20px;
        cursor: pointer;
        line-height: 1;
        padding: 4px;
        transition: color 0.15s;
      }
      .modal-close-btn:hover { color: #f7f4de; }
      .modal-body {
        padding: 24px;
        max-height: 65vh;
        overflow-y: auto;
      }
      .detail-field {
        margin-bottom: 16px;
      }
      .detail-field:last-child { margin-bottom: 0; }
      .detail-label {
        font-size: 10px;
        font-weight: 700;
        color: #8a9765;
        text-transform: uppercase;
        font-family: 'IBM Plex Mono', monospace;
        letter-spacing: 0.06em;
        margin-bottom: 4px;
      }
      .detail-val {
        font-size: 13px;
        color: #f7f4de;
        font-family: 'IBM Plex Mono', monospace;
        background: #0b130e;
        border: 1px solid #243b2c;
        border-radius: 8px;
        padding: 10px 12px;
        word-break: break-all;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .modal-footer {
        padding: 16px 24px;
        background: #0b130e;
        border-top: 1px solid #243b2c;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
      }

      /* Responsive Tablet & Mobile Breakpoint */
      @media (max-width: 1100px) {
        body { padding: 16px; }
        .nav { flex-wrap: wrap; }
        .mobile-menu-btn { display: inline-flex; align-items: center; }
        .nav-links {
          display: none;
          width: 100%;
          flex-direction: column;
          background: #16251c;
          border: 1px solid #243b2c;
          border-radius: 12px;
          padding: 12px;
          margin-top: 12px;
          box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-links.is-open { display: flex; }
        .nav-links a {
          padding: 12px 16px;
          text-align: left;
          font-size: 12px;
          border-bottom: 1px solid rgba(36, 59, 44, 0.5);
        }
        .nav-links a:last-child { border-bottom: none; }
      }
    </style>
  </head>
  <body>
    <header class="nav">
      <a href="/admin/dashboard" class="brand" data-route="/admin/dashboard">
        <div class="logo-box">
          <img src="/tera/logo.png" alt="Tera Logo" onerror="this.onerror=null; this.src='/logo.png';" />
        </div>
        <div class="brand-text">
          <span class="title">TERA WALLET</span>
          <span class="subtitle">Admin Console</span>
        </div>
      </a>
      <button class="mobile-menu-btn" id="mobileMenuToggle">☰ Menu</button>
      <div class="nav-links" id="navLinks">
        <a href="/admin/dashboard" data-route="/admin/dashboard">Overview</a>
        <a href="/admin/accounts" data-route="/admin/accounts">Accounts</a>
        <a href="/admin/tags" data-route="/admin/tags">Tags (@tags)</a>
        <a href="/admin/business-emails" data-route="/admin/business-emails">Emails</a>
        <a href="/admin/teams" data-route="/admin/teams">Teams</a>
        <a href="/admin/payment-links" data-route="/admin/payment-links">Payment Links</a>
        <a href="/admin/private-jobs" data-route="/admin/private-jobs">Private Jobs</a>
        <a href="/admin/staking" data-route="/admin/staking">Staking</a>
        <a href="/admin/audit-logs" data-route="/admin/audit-logs">Audit Logs</a>
        <a href="#" id="signOutBtn" style="color: #f87171;">Sign Out</a>
      </div>
    </header>

    <main id="app">
      <div class="empty-state">Loading Admin Console View...</div>
    </main>

    <!-- Custom Modal Container -->
    <div class="modal-overlay" id="customModalOverlay">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-title-group">
            <div class="modal-icon-badge" id="modalIcon">⚡</div>
            <h3 class="modal-title" id="modalTitle">MODAL TITLE</h3>
          </div>
          <button class="modal-close-btn" id="modalCloseXBtn">✕</button>
        </div>
        <div class="modal-body" id="modalBody">
          <!-- Dynamic Modal Content -->
        </div>
        <div class="modal-footer" id="modalFooter">
          <!-- Action Buttons -->
        </div>
      </div>
    </div>

    <script>
      const token = localStorage.getItem('tera_admin_token');
      if (!token && !location.pathname.includes('/login')) {
        window.location.href = '/admin/login';
      }

      // Mobile Menu Toggle
      const menuToggleBtn = document.getElementById('mobileMenuToggle');
      const navLinksDiv = document.getElementById('navLinks');
      if (menuToggleBtn && navLinksDiv) {
        menuToggleBtn.onclick = () => navLinksDiv.classList.toggle('is-open');
      }

      // Custom UI Modal Controller
      const modalOverlay = document.getElementById('customModalOverlay');
      const modalTitleEl = document.getElementById('modalTitle');
      const modalIconEl = document.getElementById('modalIcon');
      const modalBodyEl = document.getElementById('modalBody');
      const modalFooterEl = document.getElementById('modalFooter');
      const modalCloseXBtn = document.getElementById('modalCloseXBtn');

      function closeModal() {
        if (modalOverlay) modalOverlay.classList.remove('is-visible');
      }

      if (modalCloseXBtn) modalCloseXBtn.onclick = closeModal;
      if (modalOverlay) {
        modalOverlay.onclick = (e) => {
          if (e.target === modalOverlay) closeModal();
        };
      }

      function showModalDetails({ title, icon = 'ℹ️', fields = [], badgeText = '' }) {
        modalIconEl.textContent = icon;
        modalTitleEl.textContent = title;
        
        let html = '';
        if (badgeText) {
          html += `<div style="margin-bottom: 16px;"><span class="badge badge-success">${badgeText}</span></div>`;
        }

        html += fields.map(f => `
          <div class="detail-field">
            <div class="detail-label">${f.label}</div>
            <div class="detail-val">
              <span>${f.value}</span>
              ${f.copy ? `<button class="btn" style="padding: 3px 8px; font-size: 9px;" onclick="navigator.clipboard.writeText('${f.value}'); this.textContent='Copied!'; setTimeout(() => this.textContent='Copy', 1500);">Copy</button>` : ''}
            </div>
          </div>
        `).join('');

        modalBodyEl.innerHTML = html;
        modalFooterEl.innerHTML = `<button class="btn" onclick="closeModal()">Close</button>`;
        modalOverlay.classList.add('is-visible');
      }

      function showConfirmModal({ title, icon = '⚠️', message, confirmText = 'Confirm', confirmDanger = false, onConfirm }) {
        modalIconEl.textContent = icon;
        modalTitleEl.textContent = title;
        modalBodyEl.innerHTML = `
          <div style="font-size: 14px; color: #f7f4de; font-family: sans-serif; line-height: 1.5; padding: 8px 0;">
            ${message}
          </div>
        `;

        modalFooterEl.innerHTML = `
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn ${confirmDanger ? 'btn-danger' : ''}" id="modalConfirmActionBtn">${confirmText}</button>
        `;

        document.getElementById('modalConfirmActionBtn').onclick = async () => {
          closeModal();
          if (onConfirm) await onConfirm();
        };

        modalOverlay.classList.add('is-visible');
      }

      async function apiFetch(path, options = {}) {
        let res;
        try {
          res = await fetch('/api/admin' + path, {
            ...options,
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token,
              'x-admin-token': token || '',
              ...(options.headers || {})
            }
          });
          if (res.status === 401) {
            localStorage.removeItem('tera_admin_token');
            window.location.href = '/admin/login';
            throw Error('Unauthorized');
          }
          if (res.status === 502 || res.status === 404 || (res.headers.get('content-type') || '').includes('text/html')) {
            throw Error('Proxy status ' + res.status);
          }
        } catch (e) {
          // Fall back to direct backend port 3001
          res = await fetch('http://127.0.0.1:3001/api/admin' + path, {
            ...options,
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token,
              'x-admin-token': token || '',
              ...(options.headers || {})
            }
          });
          if (res.status === 401) {
            localStorage.removeItem('tera_admin_token');
            window.location.href = '/admin/login';
            throw Error('Unauthorized');
          }
        }
        return res.json().catch(() => ({}));
      }

      // Global state for pagination & search
      const pageState = {
        accounts: { page: 1, search: '' },
        tags: { page: 1, search: '' },
        paymentLinks: { page: 1, search: '' },
        auditLogs: { page: 1 },
        jobsType: 'send'
      };

      // Navigation Helper
      function navigateTo(route) {
        history.pushState(null, '', route);
        renderView();
      }

      // Dynamic View Renderer
      async function renderView() {
        const path = location.pathname.replace(/\/$/, '') || '/admin/dashboard';
        const app = document.getElementById('app');

        // Close mobile nav after clicking link
        if (navLinksDiv) navLinksDiv.classList.remove('is-open');

        // Highlight active nav link
        document.querySelectorAll('.nav-links a[data-route]').forEach(link => {
          const targetRoute = link.getAttribute('data-route');
          if (targetRoute === path || (targetRoute === '/admin/dashboard' && (path === '/admin' || path === '/admin/'))) {
            link.classList.add('active');
          } else {
            link.classList.remove('active');
          }
        });

        if (path === '/admin/dashboard' || path === '/admin') {
          app.innerHTML = `
            <div class="grid">
              <div class="card" onclick="navigateTo('/admin/accounts')">
                <div class="card-title">Total Accounts <span class="arrow">→</span></div>
                <div class="card-val" id="stAccounts">—</div>
              </div>
              <div class="card" onclick="navigateTo('/admin/accounts')">
                <div class="card-title">Total Intents <span class="arrow">→</span></div>
                <div class="card-val" id="stIntents">—</div>
              </div>
              <div class="card" onclick="navigateTo('/admin/tags')">
                <div class="card-title">Registered Tags <span class="arrow">→</span></div>
                <div class="card-val" id="stTags">—</div>
              </div>
              <div class="card" onclick="navigateTo('/admin/business-emails')">
                <div class="card-title">Business Emails <span class="arrow">→</span></div>
                <div class="card-val" id="stEmails">—</div>
              </div>
              <div class="card" onclick="navigateTo('/admin/payment-links')">
                <div class="card-title">Payment Links <span class="arrow">→</span></div>
                <div class="card-val" id="stPay">—</div>
              </div>
              <div class="card" onclick="navigateTo('/admin/private-jobs')">
                <div class="card-title">Private Relayer Jobs <span class="arrow">→</span></div>
                <div class="card-val" id="stJobs">—</div>
              </div>
            </div>
            <div class="section">
              <div class="section-header">
                <div>
                  <h2>Recent Security & Administrative Operations</h2>
                  <div class="sub-title">Live event audit stream from PostgreSQL database</div>
                </div>
                <button class="btn" onclick="renderView()">Refresh</button>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr><th>Action</th><th>Target Entity</th><th>Target ID</th><th>Timestamp</th></tr>
                  </thead>
                  <tbody id="activityBody">
                    <tr><td colspan="4" class="empty-state">Loading telemetry logs...</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          `;
          try {
            const data = await apiFetch('/stats');
            if (data.success && data.stats) {
              document.getElementById('stAccounts').textContent = data.stats.totalAccounts || 0;
              document.getElementById('stIntents').textContent = data.stats.totalIntents || 0;
              document.getElementById('stTags').textContent = data.stats.totalTags || 0;
              document.getElementById('stEmails').textContent = data.stats.totalBusinessEmails || 0;

          const targetRoute = link.getAttribute('data-route');
          navigateTo(targetRoute);
        }
      });

      window.addEventListener('popstate', renderView);

      document.getElementById('signOutBtn').onclick = (e) => {
        e.preventDefault();
        localStorage.removeItem('tera_admin_token');
        window.location.href = '/admin/login';
      };

      renderView();
    </script>
  </body>
</html>
